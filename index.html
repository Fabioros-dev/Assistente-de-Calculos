<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Interativo - POO</title>
    <style>
        /* ESTILOS (CSS) - Deixando o bot bonito */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #1e1e2f; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .bot-container { 
            background-color: #2a2a40; 
            width: 100%; 
            max-width: 450px; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        h2 { text-align: center; color: #4facfe; margin-top: 0; }
        h3 { color: #cfd8dc; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #4facfe; padding-bottom: 5px;}
        
        /* Telas */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Botões e Inputs */
        button { 
            width: 100%; padding: 12px; margin: 8px 0; 
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%); 
            color: #000; font-weight: bold; font-size: 14px; 
            border: none; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); transform: scale(1.02); }
        .btn-voltar { background: #ff4b4b; color: white; margin-top: 20px;}
        .btn-voltar:hover { filter: brightness(1.1); }
        
        input, select { 
            width: 100%; padding: 10px; margin: 8px 0 15px 0; 
            border-radius: 6px; border: 1px solid #4facfe; 
            background-color: #1e1e2f; color: white; font-size: 14px;
        }
        
        /* Caixa de Resultado */
        .resultado-box {
            margin-top: 20px; padding: 15px; background-color: #1e1e2f; 
            border-left: 4px solid #00f2fe; border-radius: 4px; min-height: 50px;
            font-family: monospace; font-size: 14px; word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="bot-container">
    <h2> Sistema de Conersão - NAV</h2>

    <div id="tela-menu" class="screen active">
        <h3>Menu Principal</h3>
        <p>Olá! Selecione a opção desejada:</p>
        <button onclick="mudarTela('tela-calculadora')">[1] Calculadora</button>
        <button onclick="mudarTela('tela-medidas')">[2] Medidas</button>
        <button onclick="mudarTela('tela-comissao')">[3] Calcular Comissão</button>
    </div>

    <div id="tela-calculadora" class="screen">
        <h3>Calculadora</h3>
        <input type="number" id="calc-n1" placeholder="Digite o 1º número">
        <input type="number" id="calc-n2" placeholder="Digite o 2º número">
        
        <div style="display: flex; gap: 5px;">
            <button onclick="calcular('+')">+</button>
            <button onclick="calcular('-')">-</button>
            <button onclick="calcular('*')">×</button>
            <button onclick="calcular('/')">÷</button>
        </div>

        <div class="resultado-box" id="res-calculadora">O resultado aparecerá aqui...</div>
        <button class="btn-voltar" onclick="mudarTela('tela-menu')">Voltar ao Menu</button>
    </div>

    <div id="tela-medidas" class="screen">
        <h3>Medidas e Conversões</h3>
        
        <label>Conversão Simples:</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="medida-valor" placeholder="Valor" style="width: 50%;">
            <select id="medida-tipo" style="width: 50%;">
                <option value="pol-mm">Pol ➔ mm</option>
                <option value="mm-pol">mm ➔ Pol</option>
                <option value="cm-mm">cm ➔ mm</option>
            </select>
        </div>
        <button onclick="converterMedida()">Converter Medida</button>

        <label style="display:block; margin-top:15px;">Calcular Área (M²):</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="area-larg" placeholder="Largura (m)">
            <input type="number" id="area-comp" placeholder="Comprimento (m)">
        </div>
        <button onclick="calcularArea()">Calcular M² e Hectares</button>

        <div class="resultado-box" id="res-medidas">O resultado aparecerá aqui...</div>
        <button class="btn-voltar" onclick="mudarTela('tela-menu')">Voltar ao Menu</button>
    </div>

    <div id="tela-comissao" class="screen">
        <h3>Gestão de Comissão</h3>
        <p>Meta Atual: <strong>R$ 100.000,00</strong></p>
        
        <input type="number" id="comissao-vendido" placeholder="Valor Total Vendido (R$)">
        <input type="number" id="comissao-dia" placeholder="Que dia é hoje? (1 a 31)">
        
        <button onclick="calcularMetaDia()">Verificar Valor por Dia</button>
        <button onclick="calcularComissao()">Calcular Comissão (0,35%)</button>

        <div class="resultado-box" id="res-comissao">O resultado aparecerá aqui...</div>
        <button class="btn-voltar" onclick="mudarTela('tela-menu')">Voltar ao Menu</button>
    </div>

</div>

<script>
    // Função para navegar entre as telas
    function mudarTela(idTelaDestino) {
        // Esconde todas as telas
        let telas = document.querySelectorAll('.screen');
        telas.forEach(t => t.classList.remove('active'));
        
        // Mostra a tela solicitada
        document.getElementById(idTelaDestino).classList.add('active');
        
        // Limpa as caixas de resultado ao trocar de tela
        document.getElementById('res-calculadora').innerText = "O resultado aparecerá aqui...";
        document.getElementById('res-medidas').innerText = "O resultado aparecerá aqui...";
        document.getElementById('res-comissao').innerText = "O resultado aparecerá aqui...";
    }

    // Lógica da Calculadora
    function calcular(operador) {
        let n1 = parseFloat(document.getElementById('calc-n1').value);
        let n2 = parseFloat(document.getElementById('calc-n2').value);
        let divRes = document.getElementById('res-calculadora');

        if (isNaN(n1) || isNaN(n2)) {
            divRes.innerText = "Erro: Por favor, digite os dois números!";
            return;
        }

        let resultado = 0;
        switch (operador) {
            case '+': resultado = n1 + n2; break;
            case '-': resultado = n1 - n2; break;
            case '*': resultado = n1 * n2; break;
            case '/': 
                if (n2 === 0) {
                    divRes.innerText = "Erro: Não é possível dividir por zero!";
                    return;
                }
                resultado = n1 / n2; 
                break;
        }
        divRes.innerText = `${n1} ${operador} ${n2} = ${resultado}`;
    }

    // Lógica de Medidas
    function converterMedida() {
        let valor = parseFloat(document.getElementById('medida-valor').value);
        let tipo = document.getElementById('medida-tipo').value;
        let divRes = document.getElementById('res-medidas');

        if (isNaN(valor)) {
            divRes.innerText = "Erro: Digite um valor para converter.";
            return;
        }

        let res = 0;
        let texto = "";

        if (tipo === 'pol-mm') {
            res = valor * 25.4;
            texto = `${valor} Pol = ${res.toFixed(2)} mm`;
        } else if (tipo === 'mm-pol') {
            res = valor / 25.4;
            texto = `${valor} mm = ${res.toFixed(4)} Pol`;
        } else if (tipo === 'cm-mm') {
            res = valor * 10;
            texto = `${valor} cm = ${res} mm`;
        }

        divRes.innerText = texto;
    }

    function calcularArea() {
        let larg = parseFloat(document.getElementById('area-larg').value);
        let comp = parseFloat(document.getElementById('area-comp').value);
        let divRes = document.getElementById('res-medidas');

        if (isNaN(larg) || isNaN(comp)) {
            divRes.innerText = "Erro: Digite a largura e o comprimento.";
            return;
        }

        let areaM2 = larg * comp;
        let areaHectar = areaM2 / 10000;

        divRes.innerText = `Área: ${areaM2.toFixed(2)} M²\nHectares: ${areaHectar.toFixed(4)} ha`;
    }

    // Lógica da Comissão
    const VALOR_META = 100000;

    function calcularMetaDia() {
        let vendido = parseFloat(document.getElementById('comissao-vendido').value);
        let dia = parseInt(document.getElementById('comissao-dia').value);
        let divRes = document.getElementById('res-comissao');

        if (isNaN(vendido) || isNaN(dia) || dia < 1 || dia > 31) {
            divRes.innerText = "Erro: Preencha o valor vendido e um dia válido (1 a 31).";
            return;
        }

        // Assumindo um mês padrão de 30 dias para simplificar o exemplo na web
        let diasRestantes = 30 - dia; 
        
        if (diasRestantes <= 0) {
            divRes.innerText = "O mês já acabou ou faltam 0 dias úteis.";
        } else {
            let valorPorDia = (VALOR_META - vendido) / diasRestantes;
            if(valorPorDia <= 0) {
                 divRes.innerText = "Parabéns! A meta já foi batida!";
            } else {
                 divRes.innerText = `Faltam ${diasRestantes} dias no mês.\nVocê precisa vender R$ ${valorPorDia.toFixed(2)} por dia para bater a meta.`;
            }
        }
    }

    function calcularComissao() {
        let vendido = parseFloat(document.getElementById('comissao-vendido').value);
        let divRes = document.getElementById('res-comissao');

        if (isNaN(vendido)) {
            divRes.innerText = "Erro: Digite o valor total vendido.";
            return;
        }

        let comissao = vendido * 0.0035; // 0,35%
        divRes.innerText = `Sua comissão sobre R$ ${vendido.toFixed(2)} é de:\nR$ ${comissao.toFixed(2)}`;
    }
</script>

</body>
</html>
